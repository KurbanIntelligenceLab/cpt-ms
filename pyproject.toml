[project]
name = "cpt"
version = "0.1.0"
description = "Reusable density control for inverse materials design with autoregressive models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.13", "numpy>=2.4", "scipy>=1.17", "pandas>=3.0"]

[project.optional-dependencies]
crystal = ["pymatgen>=2026.5", "smact>=4.0"]
baselines = ["cvxpy>=1.9", "cvxpylayers>=1.2"]

[project.urls]
Repository = "https://github.com/KurbanIntelligenceLab/cpt-ms"

[dependency-groups]
dev = ["pytest>=9.1", "ruff==0.16.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["development", "data", ".git", ".venv", "**/__pycache__", "**/._*", "**/.DS_Store"]

[tool.hatch.build.targets.wheel]
packages = ["src/cpt"]

[tool.hatch.build.targets.sdist.force-include]
"results/checkpoints/projected_d5.0.pt" = "results/checkpoints/projected_d5.0.pt"

[tool.hatch.build.targets.sdist]
only-include = ["src/cpt", "results", "README.md", "pyproject.toml", "uv.lock", ".gitignore"]

[tool.ruff]
line-length = 100
src = ["src"]
cache-dir = "development/local/.ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "RUF", "RET"]
ignore = ["N803", "N806", "E501", "E702", "B023", "E402", "B007"]

[tool.ruff.lint.per-file-ignores]
"src/cpt/synthetic/task.py" = ["N815"]

[tool.pytest.ini_options]
testpaths = ["development/tests"]
pythonpath = ["src", "development/tests"]
cache_dir = "development/local/.pytest_cache"
addopts = "-q"

[tool.uv]
package = true
