[project]
name = "cpt"
version = "0.1.0"
description = "A differentiable constraint projection layer for autoregressive models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.13",
    "numpy>=2.4",
    "scipy>=1.17",
    "matplotlib>=3.11",
    "pandas>=3.0",
]

[project.optional-dependencies]
crystal = [
    "pymatgen>=2026.5",
    "smact>=4.0",
    "ase>=3.29",
    "chgnet>=0.4",
]
baselines = [
    "cvxpy>=1.9",
    "cvxpylayers>=1.2",
]
dev = [
    "pytest>=9.1",
]

[project.urls]
Repository = "https://github.com/KurbanIntelligenceLab/cpt"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
