name: Verify submission

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - run: uv sync --locked --no-dev
      - run: uv run --no-sync python -m cpt.verify --results results
      - run: uv build
      - name: Check supplied checkpoint sampling
        env:
          CPT_RESULTS_DIR: development/runs/ci
        run: uv run --no-sync python -m cpt.crystal.best_of_n --ckpt results/checkpoints/projected_d5.0.pt --smoke
